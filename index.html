<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PRIME</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main">
        <p class="tagline">PREMIUM MESSENGER</p>
        <h1>PRIME</h1>
        <button id="show-reg-btn" class="status-btn">Зарегистрироваться</button>

        <div id="auth-form" class="auth-container" style="display: none;">
            <h2 id="auth-title">Регистрация</h2>
            <input type="email" id="email" placeholder="Почта" class="input-prime">
            <input type="password" id="password" placeholder="Пароль" class="input-prime">
            <button id="auth-action-btn" class="status-btn">Создать аккаунт</button>
            <p id="toggle-auth" style="cursor:pointer; font-size: 12px; margin-top: 15px; color: #888;">
                Уже есть аккаунт? <span style="color: #007aff;">Войти</span>
            </p>
        </div>
    </div>

    <div id="messenger-app" class="messenger-container" style="display: none;">
        <aside class="sidebar">
            <div class="sidebar-header">PRIME</div>
            <div class="chats-list">
                <div class="chat-item active" data-type="global">
                    <div class="chat-avatar">G</div>
                    <div class="chat-info">
                        <div class="chat-name">Общий чат</div>
                        <div class="chat-last-msg">Загрузка...</div>
                    </div>
                </div>
                <div class="chat-item" data-type="notes">
                    <div class="chat-avatar notes">Saved</div>
                    <div class="chat-info">
                        <div class="chat-name">Заметки</div>
                        <div class="chat-last-msg">Личное пространство</div>
                    </div>
                </div>
            </div>
        </aside>
        <main class="chat-window">
            <div class="chat-header">Общий чат</div>
            <div id="messages" class="messages-area"></div>
            <div class="message-input-area">
                <input type="text" id="msg-input" placeholder="Напишите сообщение..." class="input-prime">
                <button id="send-btn" class="status-btn">Отправить</button>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, push, onChildAdded, off } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmhhGZ-yS5Q8RvYVeKObnj3JlANVzPG6M",
            authDomain: "primemessenger-73933.firebaseapp.com",
            projectId: "primemessenger-73933",
            storageBucket: "primemessenger-73933.firebasestorage.app",
            messagingSenderId: "129908663923",
            appId: "1:129908663923:web:1341089b3acd29439cac06",
            measurementId: "G-2PH3N5Q2N7",
            databaseURL: "https://primemessenger-73933-default-rtdb.europe-west1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const mainScreen = document.querySelector('.main');
        const messengerApp = document.getElementById('messenger-app');
        const chatHeader = document.querySelector('.chat-header');
        const chatItems = document.querySelectorAll('.chat-item');
        const messagesArea = document.getElementById('messages');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');

        let currentUser = null;
        let currentChat = 'global';

        // Функция загрузки сообщений
        function loadMessages() {
    if (!currentUser) return; // Защита, если юзер еще не подгрузился
    
    messagesArea.innerHTML = '';
    const path = currentChat === 'global' ? 'messages/' : `notes/${currentUser.uid}/`;
    
    // Снимаем старые прослушки
    off(ref(db, 'messages/'));
    off(ref(db, `notes/${currentUser.uid}/`));

    onChildAdded(ref(db, path), (data) => {
        const msg = data.val();
        const isMine = msg.email === currentUser.email;
        
        // 1. Рисуем само сообщение в чате
        const msgDiv = document.createElement('div');
        msgDiv.className = isMine ? 'msg mine' : 'msg';
        msgDiv.innerHTML = `
            <div class="msg-sender">${currentChat === 'global' ? msg.email.split('@')[0] : 'Заметка'}</div>
            <div class="msg-text">${msg.text}</div>
        `;
        messagesArea.appendChild(msgDiv);
        messagesArea.scrollTop = messagesArea.scrollHeight;

        // 2. ВОТ ТУТ МЫ УБИРАЕМ "ЗАГРУЗКУ" И ПИШЕМ ТЕКСТ В САЙДБАР
        // Ищем активный чат и обновляем в нем последнее сообщение
        const activePreview = document.querySelector('.chat-item.active .chat-last-msg');
        if (activePreview) {
            activePreview.innerText = (isMine ? "Вы: " : "") + msg.text;
        }
    });
}

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                mainScreen.style.display = 'none';
                messengerApp.style.display = 'flex';
                loadMessages();
            } else {
                mainScreen.style.display = 'flex';
                messengerApp.style.display = 'none';
            }
        });

        chatItems.forEach(item => {
            item.onclick = () => {
                chatItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                const name = item.querySelector('.chat-name').innerText;
                chatHeader.innerText = name;
                currentChat = (name === 'Заметки') ? 'notes' : 'global';
                loadMessages();
            };
        });

        sendBtn.onclick = () => {
            const text = msgInput.value.trim();
            if (text && currentUser) {
                const path = currentChat === 'global' ? 'messages/' : `notes/${currentUser.uid}/`;
                push(ref(db, path), {
                    email: currentUser.email,
                    text: text,
                    time: new Date().toLocaleTimeString()
                });
                msgInput.value = "";
            }
        };

        // Логика кнопок входа (показать форму и т.д.)
        document.getElementById('show-reg-btn').onclick = () => {
            document.getElementById('show-reg-btn').style.display = 'none';
            document.getElementById('auth-form').style.display = 'flex';
        };

        document.getElementById('auth-action-btn').onclick = () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, pass).catch(() => {
                createUserWithEmailAndPassword(auth, email, pass).catch(e => alert(e.message));
            });
        };
    </script>
</body>
</html>
