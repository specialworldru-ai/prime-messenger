<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIME MESSENGER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main" id="main-screen">
        <h1 class="logo-text">PRIME</h1>
        <button id="show-reg-btn" class="status-btn" style="width: 200px;">Начать</button>

        <div id="auth-form" class="auth-form" style="display: none;">
            <h2 id="auth-title">Регистрация</h2>
            <input type="text" id="reg-nickname" placeholder="Никнейм (Отображаемое имя)">
            <input type="text" id="reg-username" placeholder="Юзернейм (@tag)">
            <input type="email" id="email" placeholder="Почта">
            <input type="password" id="password" placeholder="Пароль">
            <button id="auth-action-btn" class="status-btn">Создать аккаунт</button>
            <p class="auth-switch-text">Уже есть аккаунт? <span id="switch-auth">Войти</span></p>
        </div>
    </div>

    <div id="messenger-app" class="messenger-container" style="display: none;">
        <div class="sidebar">
            <div class="sidebar-header">PRIME</div>
            
            <div class="search-container">
                <input type="text" id="global-search" placeholder="Поиск #канала или @юзера...">
                <div id="search-results-bubble" class="search-bubble" style="display: none;"></div>
            </div>

            <div class="chats-list">
                <div class="chat-item active" id="btn-global">
                    <div class="chat-avatar">G</div>
                    <div class="chat-info"><div class="chat-name">Общий чат</div></div>
                </div>
                <div class="chat-item" id="btn-channels">
                    <div class="chat-avatar" style="background: #ff8c00;">#</div>
                    <div class="chat-info"><div class="chat-name">Мои Каналы</div></div>
                </div>
                <hr style="border: 0.5px solid rgba(255,255,255,0.1); width: 80%; margin: 10px auto;">
                <div id="dynamic-channels-list"></div>
            </div>

            <div class="user-profile-bottom" id="open-settings">
                <div class="chat-avatar" id="user-avatar-mini" style="background: #8a2be2;">?</div>
                <div class="chat-info">
                    <div class="chat-name" id="user-name-mini">Загрузка...</div>
                    <div id="user-tag-mini" style="font-size: 10px; color: rgba(255,255,255,0.5);">@...</div>
                </div>
            </div>
        </div>

        <div class="chat-window">
            <div class="chat-header">
                <span id="chat-title-top">Общий чат</span>
                <button id="create-chan-btn" class="status-btn" style="margin-left: auto; padding: 5px 10px; font-size: 11px; display: none;">+ Создать канал</button>
            </div>
            <div class="messages-area" id="messages"></div>
            <div class="input-area">
                <input type="text" id="msg-input" placeholder="Напишите сообщение...">
                <button id="send-btn" class="status-btn">Отправить</button>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="chat-avatar" id="prof-avatar" style="width: 70px; height: 70px; margin: 0 auto 10px; font-size: 24px;">?</div>
            <p id="prof-tag" style="color: #8a2be2; font-weight: bold; margin-bottom: 15px;"></p>
            <input type="text" id="edit-nickname" placeholder="Новый никнейм">
            <textarea id="edit-bio" placeholder="О себе"></textarea>
            <div style="display: flex; gap: 10px;">
                <button id="save-prof-btn" class="status-btn" style="flex: 1;">Сохранить</button>
                <button id="logout-btn" class="status-btn" style="background: #ff4b4b;">Выйти</button>
            </div>
            <button id="close-settings" style="margin-top: 15px; color: #888; background: none; border: none; cursor: pointer;">Закрыть</button>
        </div>
    </div>

    <div id="chan-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>Новый канал</h3>
            <input type="text" id="new-chan-name" placeholder="Название">
            <input type="text" id="new-chan-slug" placeholder="Слаг (например: news)">
            <button id="confirm-chan-btn" class="status-btn" style="width: 100%;">Создать</button>
            <button id="close-chan" style="margin-top: 10px; background: none; border: none; color: #888; cursor: pointer;">Отмена</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, push, onChildAdded, off, set, get, update, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmhhGZ-yS5Q8RvYVeKObnj3JlANVzPG6M",
            authDomain: "primemessenger-73933.firebaseapp.com",
            projectId: "primemessenger-73933",
            databaseURL: "https://primemessenger-73933-default-rtdb.europe-west1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null;
        let userData = {};
        let currentChat = 'global';

        const searchBubble = document.getElementById('search-results-bubble');
        const dynamicList = document.getElementById('dynamic-channels-list');
        const messagesArea = document.getElementById('messages');

        // --- ЛОГИКА ПРОФИЛЯ ---
        async function updateProfileUI(data) {
            document.getElementById('user-name-mini').innerText = data.nickname || "Без имени";
            document.getElementById('user-tag-mini').innerText = "@" + data.username;
            document.getElementById('user-avatar-mini').innerText = (data.nickname || "U")[0].toUpperCase();
            document.getElementById('prof-avatar').innerText = (data.nickname || "U")[0].toUpperCase();
            document.getElementById('prof-tag').innerText = "@" + data.username;
            document.getElementById('edit-nickname').value = data.nickname || "";
            document.getElementById('edit-bio').value = data.bio || "";
        }

        document.getElementById('save-prof-btn').onclick = async () => {
            const newNick = document.getElementById('edit-nickname').value.trim();
            const newBio = document.getElementById('edit-bio').value.trim();
            if(newNick) {
                await update(ref(db, `users/${currentUser.uid}`), { nickname: newNick, bio: newBio });
                userData.nickname = newNick;
                userData.bio = newBio;
                updateProfileUI(userData);
                alert("Профиль обновлен!");
                document.getElementById('settings-modal').style.display = 'none';
            }
        };

        // --- ПОИСК (КАНАЛЫ + ЛЮДИ) ---
        document.getElementById('global-search').oninput = async (e) => {
            const val = e.target.value.toLowerCase().trim().replace('#', '').replace('@', '');
            if(val.length < 2) { searchBubble.style.display = 'none'; return; }

            searchBubble.innerHTML = '';
            let found = false;

            // Ищем каналы
            const chanSnap = await get(ref(db, 'channels'));
            if (chanSnap.exists()) {
                Object.entries(chanSnap.val()).forEach(([id, chan]) => {
                    if (chan.slug.includes(val) || chan.name.toLowerCase().includes(val)) {
                        found = true;
                        createSearchItem(`#${chan.slug}`, chan.name, () => openChat(id, "# " + chan.name, true));
                    }
                });
            }

            // Ищем людей
            const userSnap = await get(ref(db, 'users'));
            if (userSnap.exists()) {
                Object.entries(userSnap.val()).forEach(([uid, user]) => {
                    if (uid !== currentUser.uid && (user.username.includes(val) || user.nickname.toLowerCase().includes(val))) {
                        found = true;
                        createSearchItem(`@${user.username}`, user.nickname, () => {
                            const dmId = [currentUser.uid, uid].sort().join('_');
                            openChat(dmId, "Чат с " + user.nickname, false);
                        });
                    }
                });
            }
            searchBubble.style.display = found ? 'block' : 'none';
        };

        function createSearchItem(title, sub, callback) {
            const item = document.createElement('div');
            item.className = 'search-item';
            item.innerHTML = `<b>${title}</b><br><small>${sub}</small>`;
            item.onclick = () => { callback(); searchBubble.style.display = 'none'; document.getElementById('global-search').value = ''; };
            searchBubble.appendChild(item);
        }

        function openChat(id, title, isChannel) {
            document.getElementById('chat-title-top').innerText = title;
            loadChat(id, isChannel);
        }

        // --- ОСТАЛЬНАЯ ЛОГИКА (AUTH, CHAT) ---
        function loadChat(chatId, isChannel = false) {
            currentChat = chatId;
            messagesArea.innerHTML = '';
            off(ref(db, `messages/${chatId}`));
            onChildAdded(ref(db, `messages/${chatId}`), (snap) => {
                const m = snap.val();
                const div = document.createElement('div');
                div.className = m.uid === currentUser.uid ? 'msg mine' : 'msg';
                div.innerHTML = `<div class="msg-sender">${m.nickname || m.username}</div><div class="msg-text">${m.text}</div>`;
                messagesArea.appendChild(div);
                messagesArea.scrollTop = messagesArea.scrollHeight;
            });
        }

        document.getElementById('send-btn').onclick = () => {
            const t = document.getElementById('msg-input').value.trim();
            if(t && currentUser) {
                push(ref(db, `messages/${currentChat}`), { 
                    uid: currentUser.uid, 
                    username: userData.username, 
                    nickname: userData.nickname, 
                    text: t 
                });
                document.getElementById('msg-input').value = '';
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if(user) {
                currentUser = user;
                const snap = await get(ref(db, `users/${user.uid}`));
                userData = snap.val() || {};
                updateProfileUI(userData);
                document.getElementById('messenger-app').style.display = 'flex';
                document.getElementById('main-screen').style.display = 'none';
                loadChat('global');
            } else {
                document.getElementById('main-screen').style.display = 'flex';
            }
        });

        document.getElementById('auth-action-btn').onclick = async () => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            const userTag = document.getElementById('reg-username').value.trim().toLowerCase();
            const nick = document.getElementById('reg-nickname').value.trim();
            
            try {
                if(document.getElementById('auth-title').innerText === "Регистрация") {
                    const res = await createUserWithEmailAndPassword(auth, email, pass);
                    await set(ref(db, `users/${res.user.uid}`), { username: userTag, nickname: nick, bio: "Всем привет!", email: email });
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
            } catch(e) { alert(e.message); }
        };

        // Кнопки интерфейса
        document.getElementById('switch-auth').onclick = () => {
            const isReg = document.getElementById('auth-title').innerText === "Регистрация";
            document.getElementById('auth-title').innerText = isReg ? "Вход" : "Регистрация";
            document.getElementById('reg-username').style.display = isReg ? "none" : "block";
            document.getElementById('reg-nickname').style.display = isReg ? "none" : "block";
        };
        document.getElementById('show-reg-btn').onclick = () => {
            document.getElementById('show-reg-btn').style.display = 'none';
            document.getElementById('auth-form').style.display = 'flex';
        };
        document.getElementById('open-settings').onclick = () => document.getElementById('settings-modal').style.display = 'flex';
        document.getElementById('close-settings').onclick = () => document.getElementById('settings-modal').style.display = 'none';
        document.getElementById('logout-btn').onclick = () => signOut(auth).then(()=>location.reload());
    </script>
</body>
</html>
