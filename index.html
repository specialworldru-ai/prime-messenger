<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PRIME</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main">
        <p class="tagline">PREMIUM MESSENGER</p>
        <h1>PRIME</h1>
        
        <button id="show-reg-btn" class="status-btn">Зарегистрироваться</button>

        <div id="auth-form" class="auth-container" style="display: none;">
            <h2 id="auth-title">Регистрация</h2>
            <input type="email" id="email" placeholder="Почта" class="input-prime">
            <input type="password" id="password" placeholder="Пароль" class="input-prime">
            
            <button id="auth-action-btn" class="status-btn">Создать аккаунт</button>
            
            <p id="toggle-auth" style="cursor:pointer; font-size: 12px; margin-top: 15px; color: #888;">
                Уже есть аккаунт? <span style="color: #007aff;">Войти</span>
            </p>
        </div>
    </div>

    <div id="messenger-app" class="messenger-container" style="display: none;">
        <aside class="sidebar">
            <div class="sidebar-header">PRIME</div>
            <div class="chats-list">
                <div class="chat-item active">Общий чат</div>
            </div>
        </aside>
        <main class="chat-window">
            <div class="chat-header">Общий чат</div>
            <div id="messages" class="messages-area">
                <div class="msg">Добро пожаловать в PRIME!</div>
            </div>
            <div class="message-input-area">
                <input type="text" id="msg-input" placeholder="Напишите сообщение..." class="input-prime">
                <button id="send-btn" class="status-btn">Отправить</button>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmhhGZ-yS5Q8RvYVeKObnj3JlANVzPG6M",
            authDomain: "primemessenger-73933.firebaseapp.com",
            projectId: "primemessenger-73933",
            storageBucket: "primemessenger-73933.firebasestorage.app",
            messagingSenderId: "129908663923",
            appId: "1:129908663923:web:1341089b3acd29439cac06",
            measurementId: "G-2PH3N5Q2N7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let isLoginMode = false;

        const showBtn = document.getElementById('show-reg-btn');
        const authForm = document.getElementById('auth-form');
        const messengerApp = document.getElementById('messenger-app');
        const mainScreen = document.querySelector('.main');
        const authTitle = document.getElementById('auth-title');
        const authActionBtn = document.getElementById('auth-action-btn');
        const toggleAuth = document.getElementById('toggle-auth');

        showBtn.onclick = () => {
            showBtn.style.display = 'none';
            authForm.style.display = 'flex';
        };

        toggleAuth.onclick = () => {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                authTitle.innerText = "Вход";
                authActionBtn.innerText = "Войти";
                toggleAuth.innerHTML = 'Нет аккаунта? <span style="color: #007aff;">Создать</span>';
            } else {
                authTitle.innerText = "Регистрация";
                authActionBtn.innerText = "Создать аккаунт";
                toggleAuth.innerHTML = 'Уже есть аккаунт? <span style="color: #007aff;">Войти</span>';
            }
        };

        authActionBtn.onclick = () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;

            if (email === "" || pass === "") {
                alert("Заполни поля!");
                return;
            }

            if (isLoginMode) {
                signInWithEmailAndPassword(auth, email, pass)
                    .then(() => {
                        mainScreen.style.display = 'none';
                        messengerApp.style.display = 'flex';
                    })
                    .catch((error) => alert("Ошибка входа: " + error.message));
            } else {
                createUserWithEmailAndPassword(auth, email, pass)
                    .then(() => {
                        mainScreen.style.display = 'none';
                        messengerApp.style.display = 'flex';
                    })
                    .catch((error) => alert("Ошибка регистрации: " + error.message));
            }
        };
    </script>
</body>
</html>
