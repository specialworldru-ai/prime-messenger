<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIME MESSENGER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main" id="main-screen">
        <h1 class="logo-text">PRIME</h1>
        
        <button id="show-reg-btn" class="status-btn" style="width: 200px;">Зарегистрироваться</button>

        <div id="auth-form" class="auth-form" style="display: none;">
            <h2 id="auth-title">Регистрация</h2>
            <input type="email" id="email" placeholder="Почта">
            <input type="password" id="password" placeholder="Пароль">
            <button id="auth-action-btn" class="status-btn">Создать аккаунт</button>
            <p class="auth-switch-text">
                Уже есть аккаунт? <span id="switch-auth">Войти</span>
            </p>
        </div>
    </div>

    <div id="messenger-app" class="messenger-container" style="display: none;">
        <div class="sidebar">
            <div class="sidebar-header">PRIME</div>
            <div class="chats-list">
                <div class="chat-item active">
                    <div class="chat-avatar">G</div>
                    <div class="chat-info">
                        <div class="chat-name">Общий чат</div>
                        <div class="chat-last-msg">Загрузка...</div>
                    </div>
                </div>
                <div class="chat-item">
                    <div class="chat-avatar" style="background: #00d2ff;">S</div>
                    <div class="chat-info">
                        <div class="chat-name">Заметки</div>
                        <div class="chat-last-msg">Личное пространство</div>
                    </div>
                </div>
            </div>

            <div class="user-profile-bottom" id="open-profile">
                <div class="chat-avatar" id="user-avatar-mini" style="background: #8a2be2;">?</div>
                <div class="chat-info">
                    <div class="chat-name" id="user-name-mini">User</div>
                    <div style="font-size: 10px; color: rgba(255,255,255,0.5);">Мой профиль</div>
                </div>
            </div>
        </div>

        <div class="chat-window">
            <div class="chat-header">Общий чат</div>
            <div class="messages-area" id="messages"></div>
            <div class="input-area">
                <input type="text" id="msg-input" placeholder="Напишите сообщение...">
                <button id="send-btn" class="status-btn">Отправить</button>
            </div>
        </div>
    </div>

    <div id="profile-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="chat-avatar" id="profile-img" style="width: 80px; height: 80px; font-size: 30px; margin: 0 auto 15px;">?</div>
            <h3 id="profile-email">email@mail.com</h3>
            <div style="color: #8a2be2; font-weight: bold; margin-bottom: 20px;">PREMIUM STATUS</div>
            <button id="logout-btn" class="status-btn" style="background: #ff4b4b;">Выйти</button>
            <button id="close-profile" style="background: none; border: none; color: #555; margin-top: 10px; cursor: pointer;">Закрыть</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, push, onChildAdded, off } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmhhGZ-yS5Q8RvYVeKObnj3JlANVzPG6M",
            authDomain: "primemessenger-73933.firebaseapp.com",
            projectId: "primemessenger-73933",
            storageBucket: "primemessenger-73933.firebasestorage.app",
            messagingSenderId: "129908663923",
            appId: "1:129908663923:web:1341089b3acd29439cac06",
            measurementId: "G-2PH3N5Q2N7",
            databaseURL: "https://primemessenger-73933-default-rtdb.europe-west1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const messagesArea = document.getElementById('messages');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        let currentUser = null;
        let currentChat = 'global';

        // ПЕРЕКЛЮЧЕНИЕ ВХОД/РЕГА
        const switchAuth = document.getElementById('switch-auth');
        const authTitle = document.getElementById('auth-title');
        const authBtn = document.getElementById('auth-action-btn');
        let isLoginMode = false;

        switchAuth.onclick = () => {
            isLoginMode = !isLoginMode;
            authTitle.innerText = isLoginMode ? "Вход" : "Регистрация";
            authBtn.innerText = isLoginMode ? "Войти" : "Создать аккаунт";
            switchAuth.innerText = isLoginMode ? "Зарегистрироваться" : "Войти";
            switchAuth.parentElement.firstChild.textContent = isLoginMode ? "Нет аккаунта? " : "Уже есть аккаунт? ";
        };

        document.getElementById('show-reg-btn').onclick = () => {
            document.getElementById('show-reg-btn').style.display = 'none';
            document.getElementById('auth-form').style.display = 'flex';
        };

        authBtn.onclick = () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            if(isLoginMode) {
                signInWithEmailAndPassword(auth, email, pass).catch(e => alert("Ошибка входа: " + e.message));
            } else {
                createUserWithEmailAndPassword(auth, email, pass).catch(e => alert("Ошибка регистрации: " + e.message));
            }
        };

        // ЛОГИКА ЧАТА
        function loadMessages() {
    if (!currentUser) return;
    
    const messagesArea = document.getElementById('messages');
    messagesArea.innerHTML = ''; // СРАЗУ УДАЛЯЕМ НАДПИСЬ "ЗАГРУЗКА"
    
    const path = currentChat === 'global' ? 'messages/' : `notes/${currentUser.uid}/`;
    
    // Переподключаемся к базе
    off(ref(db, 'messages/'));
    onChildAdded(ref(db, path), (data) => {
        const msg = data.val();
        const isMine = msg.email === currentUser.email;
        const msgDiv = document.createElement('div');
        msgDiv.className = isMine ? 'msg mine' : 'msg';
        msgDiv.innerHTML = `<div class="msg-sender">${msg.email.split('@')[0]}</div><div class="msg-text">${msg.text}</div>`;
        messagesArea.appendChild(msgDiv);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    });
}
    
    messagesArea.innerHTML = '<div style="text-align:center; opacity:0.5;">Загрузка сообщений...</div>';
    
    // Определяем путь в базе
    const path = currentChat === 'global' ? 'messages/' : `notes/${currentUser.uid}/`;
    
    // Снимаем старые слушатели, чтобы не дублировать
    off(ref(db, 'messages/'));
    if (currentUser) off(ref(db, `notes/${currentUser.uid}/`));

    // Слушаем новые сообщения
    onChildAdded(ref(db, path), (data) => {
        // Убираем надпись "Загрузка" при первом же сообщении
        if (messagesArea.innerText.includes("Загрузка сообщений...")) {
            messagesArea.innerHTML = '';
        }
        
        const msg = data.val();
        const isMine = msg.email === currentUser.email;
        const msgDiv = document.createElement('div');
        msgDiv.className = isMine ? 'msg mine' : 'msg';
        
        // Красивое отображение отправителя
        const displayName = currentChat === 'global' ? msg.email.split('@')[0] : 'Личная заметка';
        
        msgDiv.innerHTML = `
            <div class="msg-sender">${displayName}</div>
            <div class="msg-text">${msg.text}</div>
        `;
        
        messagesArea.appendChild(msgDiv);
        messagesArea.scrollTop = messagesArea.scrollHeight;
        
        // Обновляем текст в сайдбаре (чтобы "Загрузка" пропала и там)
        const activeChatMsg = document.querySelector('.chat-item.active .chat-last-msg');
        if (activeChatMsg) activeChatMsg.innerText = msg.text.substring(0, 20) + "...";
    });
}

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('main-screen').style.display = 'none';
                document.getElementById('messenger-app').style.display = 'flex';
                document.getElementById('user-name-mini').innerText = user.email.split('@')[0];
                document.getElementById('user-avatar-mini').innerText = user.email[0].toUpperCase();
                document.getElementById('profile-email').innerText = user.email;
                document.getElementById('profile-img').innerText = user.email[0].toUpperCase();
                loadMessages();
            } else {
                document.getElementById('main-screen').style.display = 'flex';
                document.getElementById('messenger-app').style.display = 'none';
            }
        });

        sendBtn.onclick = () => {
            const text = msgInput.value.trim();
            if (text && currentUser) {
                const path = currentChat === 'global' ? 'messages/' : `notes/${currentUser.uid}/`;
                push(ref(db, path), { email: currentUser.email, text: text, time: new Date().toLocaleTimeString() });
                msgInput.value = "";
            }
        };

        // КЛИКИ ПО ЧАТАМ
        document.querySelectorAll('.chat-item').forEach(item => {
            item.onclick = () => {
                document.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                const name = item.querySelector('.chat-name').innerText;
                document.querySelector('.chat-header').innerText = name;
                currentChat = (name === 'Заметки') ? 'notes' : 'global';
                loadMessages();
            };
        });

        // МОДАЛКА
        document.getElementById('open-profile').onclick = () => document.getElementById('profile-modal').style.display = 'flex';
        document.getElementById('close-profile').onclick = () => document.getElementById('profile-modal').style.display = 'none';
        document.getElementById('logout-btn').onclick = () => {
            signOut(auth).then(() => location.reload());
        };
    </script>
</body>
</html>
