<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIME MESSENGER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main" id="main-screen">
        <h1 class="logo-text">PRIME</h1>
        <button id="show-reg-btn" class="status-btn" style="width: 200px;">Начать</button>

        <div id="auth-form" class="auth-form" style="display: none;">
            <h2 id="auth-title">Регистрация</h2>
            <input type="text" id="reg-username" placeholder="Юзернейм (@name)">
            <input type="email" id="email" placeholder="Почта">
            <input type="password" id="password" placeholder="Пароль">
            <button id="auth-action-btn" class="status-btn">Создать аккаунт</button>
            <p class="auth-switch-text">Уже есть аккаунт? <span id="switch-auth">Войти</span></p>
        </div>
    </div>

    <div id="messenger-app" class="messenger-container" style="display: none;">
        <div class="sidebar">
            <div class="sidebar-header">PRIME</div>
            
            <div class="search-container" style="padding: 0 10px 10px; position: relative;">
                <input type="text" id="global-search" placeholder="Поиск #канала..." 
                       style="width: 100%; padding: 8px; border-radius: 8px; background: rgba(0,0,0,0.3); border: 1px solid rgba(138,43,226,0.3); color: white; font-size: 12px;">
                <div id="search-results-bubble" class="search-bubble" style="display: none;"></div>
            </div>

            <div class="chats-list">
                <div class="chat-item active" id="btn-global">
                    <div class="chat-avatar">G</div>
                    <div class="chat-info"><div class="chat-name">Общий чат</div></div>
                </div>
                <div class="chat-item" id="btn-channels">
                    <div class="chat-avatar" style="background: #ff8c00;">#</div>
                    <div class="chat-info"><div class="chat-name">Мои Каналы</div></div>
                </div>
                <hr style="border: 0.5px solid rgba(255,255,255,0.1); width: 80%;">
                <div id="dynamic-channels-list"></div>
            </div>

            <div class="user-profile-bottom" id="open-settings">
                <div class="chat-avatar" id="user-avatar-mini" style="background: #8a2be2;">?</div>
                <div class="chat-info">
                    <div class="chat-name" id="user-name-mini">Загрузка...</div>
                    <div style="font-size: 10px; color: rgba(255,255,255,0.5);">Настройки профиля</div>
                </div>
            </div>
        </div>

        <div class="chat-window">
            <div class="chat-header">
                <span id="chat-title-top">Общий чат</span>
                <button id="create-chan-btn" class="status-btn" style="margin-left: auto; padding: 5px 10px; font-size: 11px; display: none;">+ Создать канал</button>
            </div>
            <div class="messages-area" id="messages"></div>
            <div class="input-area">
                <input type="text" id="msg-input" placeholder="Напишите сообщение...">
                <button id="send-btn" class="status-btn">Отправить</button>
            </div>
        </div>
    </div>

    <div id="comments-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="width: 400px; height: 500px; display: flex; flex-direction: column;">
            <h3 style="margin-bottom: 10px;">Комментарии</h3>
            <div id="comments-list" style="flex: 1; overflow-y: auto; margin-bottom: 10px; text-align: left;"></div>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="comm-input" placeholder="Ваш коммент..." style="flex: 1; padding: 8px; border-radius: 5px;">
                <button id="send-comm-btn" class="status-btn" style="padding: 5px 10px;">></button>
            </div>
            <button id="close-comments" style="margin-top: 10px; color: #777; cursor: pointer; border: none; background: none;">Закрыть</button>
        </div>
    </div>

    <div id="settings-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="width: 350px;">
            <div class="chat-avatar" id="prof-avatar" style="width: 70px; height: 70px; margin: 0 auto 10px; font-size: 24px;">?</div>
            <input type="text" id="edit-username" placeholder="Изменить имя">
            <textarea id="edit-bio" placeholder="О себе" style="width: 100%; height: 60px; background: #000; color: #fff; margin-bottom: 10px; border-radius: 8px;"></textarea>
            <div style="display: flex; gap: 10px;">
                <button id="save-prof-btn" class="status-btn" style="flex: 1;">Сохранить</button>
                <button id="logout-btn" class="status-btn" style="background: #ff4b4b;">Выйти</button>
            </div>
            <button id="close-settings" style="margin-top: 15px; color: #888; background: none; border: none; cursor: pointer;">Закрыть</button>
        </div>
    </div>

    <div id="chan-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>Новый канал</h3>
            <input type="text" id="new-chan-name" placeholder="Название">
            <input type="text" id="new-chan-slug" placeholder="Слаг (без #, например: news)">
            <button id="confirm-chan-btn" class="status-btn" style="width: 100%;">Создать</button>
            <button id="close-chan" style="margin-top: 10px; background: none; border: none; color: #888; cursor: pointer;">Отмена</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, push, onChildAdded, off, set, get, update, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmhhGZ-yS5Q8RvYVeKObnj3JlANVzPG6M",
            authDomain: "primemessenger-73933.firebaseapp.com",
            projectId: "primemessenger-73933",
            databaseURL: "https://primemessenger-73933-default-rtdb.europe-west1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null;
        let userData = { username: "Аноним" };
        let currentChat = 'global';
        let activePostId = null; // Для комментов

        const messagesArea = document.getElementById('messages');
        const searchBubble = document.getElementById('search-results-bubble');

        // Смена входа
        let isLogin = false;
        document.getElementById('switch-auth').onclick = () => {
            isLogin = !isLogin;
            document.getElementById('auth-title').innerText = isLogin ? "Вход" : "Регистрация";
            document.getElementById('reg-username').style.display = isLogin ? "none" : "block";
            document.getElementById('auth-action-btn').innerText = isLogin ? "Войти" : "Создать аккаунт";
        };

        document.getElementById('show-reg-btn').onclick = () => {
            document.getElementById('show-reg-btn').style.display = 'none';
            document.getElementById('auth-form').style.display = 'flex';
        };

        // Регистрация / Логин
        document.getElementById('auth-action-btn').onclick = async () => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            const name = document.getElementById('reg-username').value.trim();
            if(!email || !pass) return alert("Заполни поля");

            try {
                if(!isLogin) {
                    if(!name) return alert("Нужен юзернейм!");
                    const res = await createUserWithEmailAndPassword(auth, email, pass);
                    await set(ref(db, `users/${res.user.uid}`), { username: name, bio: "Hi!", email: email });
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
            } catch(e) { alert(e.message); }
        };

        // Загрузка чата
        function loadChat(chatId, isChannel = false) {
            currentChat = chatId;
            messagesArea.innerHTML = '';
            off(ref(db, `messages/${chatId}`));
            
            onChildAdded(ref(db, `messages/${chatId}`), (snap) => {
                const m = snap.val();
                const div = document.createElement('div');
                div.className = m.uid === currentUser.uid ? 'msg mine' : 'msg';
                
                // Кнопка комментов только для каналов
                const commBtn = isChannel ? `<div class="comm-trigger" onclick="window.openComments('${chatId}', '${snap.key}')">💬 Ответить</div>` : '';
                
                div.innerHTML = `<div class="msg-sender">${m.username}</div><div class="msg-text">${m.text}</div>${commBtn}`;
                messagesArea.appendChild(div);
                messagesArea.scrollTop = messagesArea.scrollHeight;
            });
        }

        // Комментарии
        window.openComments = async (chatId, msgId) => {
            activePostId = msgId;
            document.getElementById('comments-modal').style.display = 'flex';
            const list = document.getElementById('comments-list');
            list.innerHTML = 'Загрузка...';
            
            off(ref(db, `comments/${msgId}`));
            onChildAdded(ref(db, `comments/${msgId}`), (snap) => {
                if(list.innerText === 'Загрузка...') list.innerHTML = '';
                const c = snap.val();
                list.innerHTML += `<div style="margin-bottom:8px; font-size:13px;"><b style="color:#8a2be2;">${c.username}:</b> ${c.text}</div>`;
            });
        };

        document.getElementById('send-comm-btn').onclick = () => {
            const input = document.getElementById('comm-input');
            if(input.value.trim() && activePostId) {
                push(ref(db, `comments/${activePostId}`), {
                    username: userData.username,
                    text: input.value.trim()
                });
                input.value = '';
            }
        };

        // Поиск с "Облачком"
        document.getElementById('global-search').oninput = async (e) => {
            const val = e.target.value.toLowerCase().trim().replace('#', '');
            if(val.length < 2) { searchBubble.style.display = 'none'; return; }

            const snap = await get(query(ref(db, 'channels'), orderByChild('slug'), equalTo(val)));
            if(snap.exists()) {
                const id = Object.keys(snap.val())[0];
                const chan = snap.val()[id];
                searchBubble.innerHTML = `<div class="search-item" id="found-${id}">
                    <b>#${chan.slug}</b><br><small>${chan.name}</small>
                </div>`;
                searchBubble.style.display = 'block';

                document.getElementById(`found-${id}`).onclick = () => {
                    document.getElementById('chat-title-top').innerText = "# " + chan.name;
                    loadChat(id, true);
                    searchBubble.style.display = 'none';
                    e.target.value = '';
                };
            } else {
                searchBubble.innerHTML = '<div style="padding:10px; font-size:11px;">Ничего не найдено</div>';
                searchBubble.style.display = 'block';
            }
        };

        // Состояние
        onAuthStateChanged(auth, async (user) => {
            if(user) {
                currentUser = user;
                const snap = await get(ref(db, `users/${user.uid}`));
                userData = snap.val() || { username: "User" };
                
                document.getElementById('user-name-mini').innerText = userData.username;
                document.getElementById('user-avatar-mini').innerText = userData.username[0].toUpperCase();
                document.getElementById('messenger-app').style.display = 'flex';
                document.getElementById('main-screen').style.display = 'none';
                loadChat('global');
            } else {
                document.getElementById('messenger-app').style.display = 'none';
                document.getElementById('main-screen').style.display = 'flex';
            }
        });

        // Отправка
        document.getElementById('send-btn').onclick = () => {
            const t = document.getElementById('msg-input').value.trim();
            if(t && currentUser) {
                push(ref(db, `messages/${currentChat}`), {
                    uid: currentUser.uid,
                    username: userData.username,
                    text: t
                });
                document.getElementById('msg-input').value = '';
            }
        };

        // Каналы
        document.getElementById('btn-channels').onclick = () => {
            document.getElementById('chat-title-top').innerText = "Мои каналы";
            document.getElementById('create-chan-btn').style.display = 'block';
            messagesArea.innerHTML = '<p style="text-align:center; opacity:0.3; margin-top:50px;">Создайте свой канал через кнопку сверху</p>';
        };

        document.getElementById('confirm-chan-btn').onclick = async () => {
            const name = document.getElementById('new-chan-name').value;
            const slug = document.getElementById('new-chan-slug').value.toLowerCase();
            if(!name || !slug) return alert("Заполни всё");
            
            const newRef = push(ref(db, 'channels'));
            await set(newRef, { name, slug, owner: currentUser.uid });
            alert("Канал готов! Его можно найти по #" + slug);
            document.getElementById('chan-modal').style.display = 'none';
        };

        // Кнопки интерфейса
        document.getElementById('open-settings').onclick = () => {
            document.getElementById('settings-modal').style.display = 'flex';
            document.getElementById('edit-username').value = userData.username;
            document.getElementById('prof-avatar').innerText = userData.username[0].toUpperCase();
        };
        document.getElementById('save-prof-btn').onclick = async () => {
            await update(ref(db, `users/${currentUser.uid}`), { 
                username: document.getElementById('edit-username').value,
                bio: document.getElementById('edit-bio').value
            });
            location.reload();
        };

        document.getElementById('btn-global').onclick = () => { 
            document.getElementById('chat-title-top').innerText = "Общий чат";
            document.getElementById('create-chan-btn').style.display = 'none';
            loadChat('global'); 
        };
        document.getElementById('create-chan-btn').onclick = () => document.getElementById('chan-modal').style.display = 'flex';
        document.getElementById('close-settings').onclick = () => document.getElementById('settings-modal').style.display = 'none';
        document.getElementById('close-chan').onclick = () => document.getElementById('chan-modal').style.display = 'none';
        document.getElementById('close-comments').onclick = () => document.getElementById('comments-modal').style.display = 'none';
        document.getElementById('logout-btn').onclick = () => signOut(auth).then(()=>location.reload());

    </script>
</body>
</html>
