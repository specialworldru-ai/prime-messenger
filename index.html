<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PRIME</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main">
        <p class="tagline">PREMIUM MESSENGER</p>
        <h1>PRIME</h1>
        
        <button id="show-reg-btn" class="status-btn">Зарегистрироваться</button>

        <div id="auth-form" class="auth-container" style="display: none;">
            <h2 id="auth-title">Регистрация</h2>
            <input type="email" id="email" placeholder="Почта" class="input-prime">
            <input type="password" id="password" placeholder="Пароль" class="input-prime">
            
            <button id="auth-action-btn" class="status-btn">Создать аккаунт</button>
            
            <p id="toggle-auth" style="cursor:pointer; font-size: 12px; margin-top: 15px; color: #888;">
                Уже есть аккаунт? <span style="color: #007aff;">Войти</span>
            </p>
        </div>
    </div>

    <div id="messenger-app" class="messenger-container" style="display: none;">
        <aside class="sidebar">
            <div class="sidebar-header">PRIME</div>
            <div class="chats-list">
                
                <div class="chat-item active">
                    <div class="chat-avatar">G</div>
                    <div class="chat-info">
                        <div class="chat-name">Общий чат</div>
                        <div class="chat-last-msg">Загрузка сообщений...</div>
                    </div>
                </div>

                <div class="chat-item">
                    <div class="chat-avatar notes">Saved</div>
                    <div class="chat-info">
                        <div class="chat-name">Заметки</div>
                        <div class="chat-last-msg">Личное пространство</div>
                    </div>
                </div>

                <div class="chat-item">
                    <div class="chat-avatar">S</div>
                    <div class="chat-info">
                        <div class="chat-name">Support</div>
                        <div class="chat-last-msg">Бот поддержки PRIME</div>
                    </div>
                </div>

            </div>
        </aside>

        <main class="chat-window">
            <div class="chat-header">Общий чат</div>
            <div id="messages" class="messages-area"></div>
            <div class="message-input-area">
                <input type="text" id="msg-input" placeholder="Напишите сообщение..." class="input-prime">
                <button id="send-btn" class="status-btn">Отправить</button>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmhhGZ-yS5Q8RvYVeKObnj3JlANVzPG6M",
            authDomain: "primemessenger-73933.firebaseapp.com",
            projectId: "primemessenger-73933",
            storageBucket: "primemessenger-73933.firebasestorage.app",
            messagingSenderId: "129908663923",
            appId: "1:129908663923:web:1341089b3acd29439cac06",
            measurementId: "G-2PH3N5Q2N7", // Тут добавлена запятая!
            databaseURL: "https://primemessenger-73933-default-rtdb.europe-west1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const mainScreen = document.querySelector('.main');
        const messengerApp = document.getElementById('messenger-app');
        const authForm = document.getElementById('auth-form');
        const showBtn = document.getElementById('show-reg-btn');
        const authTitle = document.getElementById('auth-title');
        const authActionBtn = document.getElementById('auth-action-btn');
        const toggleAuth = document.getElementById('toggle-auth');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        const messagesArea = document.getElementById('messages');

        let currentUser = null;
        let isLoginMode = false;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                mainScreen.style.display = 'none';
                messengerApp.style.display = 'flex';
            } else {
                mainScreen.style.display = 'flex';
                messengerApp.style.display = 'none';
            }
        });

        showBtn.onclick = () => {
            showBtn.style.display = 'none';
            authForm.style.display = 'flex';
        };

        toggleAuth.onclick = () => {
            isLoginMode = !isLoginMode;
            authTitle.innerText = isLoginMode ? "Вход" : "Регистрация";
            authActionBtn.innerText = isLoginMode ? "Войти" : "Создать аккаунт";
            toggleAuth.innerHTML = isLoginMode ? 
                'Нет аккаунта? <span style="color: #007aff;">Создать</span>' : 
                'Уже есть аккаунт? <span style="color: #007aff;">Войти</span>';
        };

        authActionBtn.onclick = () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            if (!email || !pass) return alert("Заполни поля!");

            if (isLoginMode) {
                signInWithEmailAndPassword(auth, email, pass).catch(e => alert(e.message));
            } else {
                createUserWithEmailAndPassword(auth, email, pass).catch(e => alert(e.message));
            }
        };

        sendBtn.onclick = () => {
            const text = msgInput.value.trim();
            if (text && currentUser) {
                push(ref(db, 'messages/'), {
                    email: currentUser.email,
                    text: text,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });
                msgInput.value = "";
            }
        };

        msgInput.onkeydown = (e) => { if(e.key === 'Enter') sendBtn.click(); };

        // Прием сообщений
        onChildAdded(ref(db, 'messages/'), (data) => {
            const msg = data.val();
            if (!currentUser) return; // Ждем пока юзер залогинится

            const isMine = msg.email === currentUser.email;
            const msgDiv = document.createElement('div');
            msgDiv.className = isMine ? 'msg mine' : 'msg';
            msgDiv.innerHTML = `
                <div class="msg-sender">${msg.email.split('@')[0]}</div>
                <div class="msg-text">${msg.text}</div>
            `;
            messagesArea.appendChild(msgDiv);
            messagesArea.scrollTop = messagesArea.scrollHeight;

            const preview = document.querySelector('.chat-item.active .chat-last-msg');
            if (preview) {
                preview.innerText = (isMine ? "Вы: " : "") + msg.text;
            }
        });
    </script>
</body>
</html>
